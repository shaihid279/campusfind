<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.title} + ' - CampusFind'">Item Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <span class="badge mb-2" th:classappend="${item.itemType.name() == 'LOST'} ? 'bg-danger' : 'bg-success'"
                          th:text="${item.itemType}"></span>
                    <span class="badge bg-secondary mb-2" th:text="${item.status}"></span>

                    <h2 th:text="${item.title}"></h2>
                    <p class="text-muted" th:text="'Item ID: ' + ${item.uniqueItemCode}"></p>

                    <hr>

                    <p><strong>Description:</strong> <span th:text="${item.description}"></span></p>
                    <p><strong>Category:</strong> <span th:text="${item.category?.name}"></span></p>
                    <p><strong>Location:</strong> <span th:text="${item.location}"></span></p>
                    <p><strong>Date:</strong> <span th:text="${item.itemDate}"></span></p>
                    <p th:if="${item.color}"><strong>Color:</strong> <span th:text="${item.color}"></span></p>
                    <p th:if="${item.brand}"><strong>Brand:</strong> <span th:text="${item.brand}"></span></p>
                    <p th:if="${item.identifyingFeatures}"><strong>Identifying Features:</strong> <span th:text="${item.identifyingFeatures}"></span></p>
                    <p th:if="${item.itemType.name() == 'FOUND'}"><strong>Reporter Type:</strong> <span th:text="${item.user.role}"></span></p>

                    <div class="mt-4">
                        <a th:href="@{/items}" class="btn btn-outline-secondary">Back to Items</a>
                        <a th:if="${item.itemType.name() == 'FOUND'}" th:href="@{/claims/{itemId}/submit(itemId=${item.id})}" class="btn btn-primary">Claim This Item</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
