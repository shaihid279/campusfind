<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Lost Item - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">Report a Lost Item</h3>

                    <form th:action="@{/items/report-lost}" th:object="${itemRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Item Name</label>
                            <input type="text" class="form-control" th:field="*{title}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{categoryId}">
                                <option value="">-- Select Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date Lost</label>
                                <input type="date" class="form-control" th:field="*{itemDate}">
                                <div class="text-danger small" th:if="${#fields.hasErrors('itemDate')}" th:errors="*{itemDate}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Approximate Time</label>
                                <input type="time" class="form-control" th:field="*{itemTime}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location Lost</label>
                            <input type="text" class="form-control" th:field="*{location}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control" th:field="*{color}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Brand</label>
                                <input type="text" class="form-control" th:field="*{brand}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Identifying Features</label>
                            <textarea class="form-control" rows="2" th:field="*{identifyingFeatures}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Additional Information</label>
                            <textarea class="form-control" rows="2" th:field="*{additionalInformation}"></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">Submit Lost Item Report</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
