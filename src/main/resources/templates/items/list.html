<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse Items - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Browse Items</h2>
        <div>
            <a th:href="@{/items/report-lost}" class="btn btn-danger btn-sm">Report Lost</a>
            <a th:href="@{/items/report-found}" class="btn btn-success btn-sm">Report Found</a>
        </div>
    </div>

    <div class="mb-4">
        <a th:href="@{/items}" class="btn btn-outline-secondary btn-sm">All</a>
        <a th:href="@{/items(type='lost')}" class="btn btn-outline-danger btn-sm">Lost Only</a>
        <a th:href="@{/items(type='found')}" class="btn btn-outline-success btn-sm">Found Only</a>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(items)}">
        <div class="col-md-4" th:each="item : ${items}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge mb-2" th:classappend="${item.itemType.name() == 'LOST'} ? 'bg-danger' : 'bg-success'"
                          th:text="${item.itemType}"></span>
                    <h5 class="card-title" th:text="${item.title}"></h5>
                    <p class="card-text mb-1">📍 <span th:text="${item.location}"></span></p>
                    <p class="card-text mb-3">📅 <span th:text="${item.itemDate}"></span></p>
                    <a th:href="@{/items/{code}(code=${item.uniqueItemCode})}" class="btn btn-outline-primary btn-sm">View Details</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="text-center text-muted py-5">
        <p>No items to show yet.</p>
    </div>
</div>
</body>
</html>
