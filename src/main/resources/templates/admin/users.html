<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-dark min-vh-100 p-3">
            <h5 class="text-white mb-4">CampusFind Admin</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/users}">Users</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/items}">Items</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/claims}">Claims</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/categories}">Categories</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/logs}">Activity Logs</a></li>
                <li class="nav-item mt-3">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">Logout</button>
                    </form>
                </li>
            </ul>
        </nav>
        <main class="col-md-10 py-4">
            <h2 class="mb-4">Manage Users</h2>
            <table class="table table-bordered bg-white">
                <thead><tr><th>Name</th><th>Email</th><th>College ID</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.collegeId}"></td>
                    <td th:text="${u.role}"></td>
                    <td>
                        <span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${u.enabled} ? 'Active' : 'Disabled'"></span>
                    </td>
                    <td>
                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                    th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </main>
    </div>
</div>
</body>
</html>
