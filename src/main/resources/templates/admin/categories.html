<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-dark min-vh-100 p-3">
            <h5 class="text-white mb-4">CampusFind Admin</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/users}">Users</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/items}">Items</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/claims}">Claims</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/categories}">Categories</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/logs}">Activity Logs</a></li>
                <li class="nav-item mt-3">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">Logout</button>
                    </form>
                </li>
            </ul>
        </nav>
        <main class="col-md-10 py-4">
            <h2 class="mb-4">Manage Categories</h2>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form th:action="@{/admin/categories/add}" method="post" class="d-flex gap-2 mb-4" style="max-width: 400px;">
                <input type="text" name="name" class="form-control" placeholder="New category name" required>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
            <table class="table table-bordered bg-white" style="max-width: 500px;">
                <thead><tr><th>Name</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.name}"></td>
                    <td>
                        <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post"
                              onsubmit="return confirm('Delete this category?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </main>
    </div>
</div>
</body>
</html>
