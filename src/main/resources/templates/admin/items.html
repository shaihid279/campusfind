<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Items - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-dark min-vh-100 p-3" th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
        <main class="col-md-10 py-4">
            <h2 class="mb-4">Manage Items</h2>
            <table class="table table-bordered bg-white">
                <thead><tr><th>Item ID</th><th>Title</th><th>Type</th><th>Status</th><th>Reported By</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="i : ${items}">
                    <td th:text="${i.uniqueItemCode}"></td>
                    <td th:text="${i.title}"></td>
                    <td th:text="${i.itemType}"></td>
                    <td th:text="${i.status}"></td>
                    <td th:text="${i.user.fullName}"></td>
                    <td>
                        <form th:action="@{/admin/items/{id}/remove(id=${i.id})}" method="post"
                              onsubmit="return confirm('Remove this listing?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </main>
    </div>
</div>
</body>
</html>
