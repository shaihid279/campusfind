<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-dark min-vh-100 p-3">
            <h5 class="text-white mb-4">CampusFind Admin</h5>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/users}">Users</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/items}">Items</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/claims}">Claims</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/categories}">Categories</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/admin/logs}">Activity Logs</a></li>
                <li class="nav-item mt-3">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">Logout</button>
                    </form>
                </li>
            </ul>
        </nav>
        <main class="col-md-10 py-4">
            <h2 class="mb-4">Admin Dashboard</h2>
            <div class="row g-3">
                <div class="col-md-2"><div class="card text-center shadow-sm"><div class="card-body">
                    <h4 th:text="${stats.totalUsers}"></h4><p class="text-muted mb-0">Total Users</p></div></div></div>
                <div class="col-md-2"><div class="card text-center shadow-sm"><div class="card-body">
                    <h4 th:text="${stats.lostReports}"></h4><p class="text-muted mb-0">Lost Reports</p></div></div></div>
                <div class="col-md-2"><div class="card text-center shadow-sm"><div class="card-body">
                    <h4 th:text="${stats.foundReports}"></h4><p class="text-muted mb-0">Found Reports</p></div></div></div>
                <div class="col-md-2"><div class="card text-center shadow-sm"><div class="card-body">
                    <h4 th:text="${stats.pendingClaims}"></h4><p class="text-muted mb-0">Pending Claims</p></div></div></div>
                <div class="col-md-2"><div class="card text-center shadow-sm"><div class="card-body">
                    <h4 th:text="${stats.returnedItems}"></h4><p class="text-muted mb-0">Returned Items</p></div></div></div>
                <div class="col-md-2"><div class="card text-center shadow-sm bg-success text-white"><div class="card-body">
                    <h4 th:text="${stats.recoveryRate} + '%'"></h4><p class="mb-0">Recovery Rate</p></div></div></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
