<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activity Logs - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-dark min-vh-100 p-3" th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
        <main class="col-md-10 py-4">
            <h2 class="mb-4">Activity Logs</h2>
            <table class="table table-bordered bg-white">
                <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Description</th></tr></thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.timestamp}"></td>
                    <td th:text="${log.user != null ? log.user.fullName : 'System'}"></td>
                    <td th:text="${log.action}"></td>
                    <td th:text="${log.description}"></td>
                </tr>
                </tbody>
            </table>
        </main>
    </div>
</div>
</body>
</html>
