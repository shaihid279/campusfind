<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Review Claims - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-dark min-vh-100 p-3" th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
        <main class="col-md-10 py-4">
            <h2 class="mb-4">Review Claims</h2>

            <div class="card mb-3 shadow-sm" th:each="c : ${claims}">
                <div class="card-body">
                    <h5 th:text="${c.item.title} + ' — ' + ${c.item.uniqueItemCode}"></h5>
                    <p class="text-muted mb-1" th:text="'Claimant: ' + ${c.claimant.fullName}"></p>
                    <p class="mb-2" style="white-space: pre-line;" th:text="${c.proofDescription}"></p>
                    <span class="badge bg-warning text-dark mb-2" th:text="${c.status}"></span>

                    <div class="d-flex gap-2 mt-2">
                        <form th:action="@{/admin/claims/{id}/under-review(id=${c.id})}" method="post" th:if="${c.status.name() == 'PENDING'}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Mark Under Review</button>
                        </form>
                        <form th:action="@{/admin/claims/{id}/approve(id=${c.id})}" method="post">
                            <input type="text" name="comment" placeholder="Comment (optional)" class="form-control form-control-sm d-inline w-auto">
                            <button type="submit" class="btn btn-sm btn-success">Approve</button>
                        </form>
                        <form th:action="@{/admin/claims/{id}/reject(id=${c.id})}" method="post">
                            <input type="text" name="comment" placeholder="Reason" class="form-control form-control-sm d-inline w-auto">
                            <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                        </form>
                    </div>
                </div>
            </div>

            <p th:if="${#lists.isEmpty(claims)}" class="text-muted">No pending claims.</p>
        </main>
    </div>
</div>
</body>
</html>
