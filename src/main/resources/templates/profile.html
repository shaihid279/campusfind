<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">My Profile</h3>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                    <div class="text-center mb-4">
                        <img th:if="${user.profilePhotoUrl}" th:src="@{${user.profilePhotoUrl}}"
                             style="width:100px;height:100px;border-radius:50%;object-fit:cover;">
                        <div th:unless="${user.profilePhotoUrl}"
                             style="width:100px;height:100px;border-radius:50%;background:#0d9488;color:#fff;
                                    display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto;"
                             th:text="${#strings.substring(user.fullName, 0, 1)}"></div>
                    </div>

                    <p class="text-muted text-center mb-4">
                        <span th:text="${user.email}"></span> &middot; <span th:text="${user.collegeId}"></span>
                    </p>

                    <form th:action="@{/profile}" th:object="${profileRequest}" method="post" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{fullName}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" th:field="*{department}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input type="text" class="form-control" th:field="*{year}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Update Profile Photo</label>
                            <input type="file" name="photo" class="form-control" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
