<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4">My Claims</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div th:if="${not #lists.isEmpty(claims)}">
        <div class="card mb-3 shadow-sm" th:each="claim : ${claims}">
            <div class="card-body">
                <h5 th:text="${claim.item.title}"></h5>
                <span class="badge"
                      th:classappend="${claim.status.name() == 'APPROVED'} ? 'bg-success' :
                                       (${claim.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                      th:text="${claim.status}"></span>
                <p class="mt-2 mb-0 text-muted" th:if="${claim.adminComment}" th:text="'Admin note: ' + ${claim.adminComment}"></p>

                <!-- Contact details revealed only after approval -->
                <div th:if="${claim.status.name() == 'APPROVED'}" class="alert alert-success mt-3 mb-2">
                    <strong>✅ Approved! Collect your item from:</strong>
                    <ul class="mb-0 mt-2">
                        <li th:if="${claim.item.storageLocation}">
                            <strong>Pickup Location:</strong> <span th:text="${claim.item.storageLocation}"></span>
                        </li>
                        <li><strong>Reported by:</strong> <span th:text="${claim.item.user.fullName}"></span></li>
                        <li th:if="${claim.item.user.phone}">
                            <strong>Contact Phone:</strong> <span th:text="${claim.item.user.phone}"></span>
                        </li>
                        <li><strong>Contact Email:</strong> <span th:text="${claim.item.user.email}"></span></li>
                    </ul>
                </div>

                <a th:if="${claim.status.name() == 'APPROVED'}"
                   th:href="@{/claims/{id}/rate(id=${claim.id})}"
                   class="btn btn-sm btn-primary mt-2">Rate the Finder</a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(claims)}" class="text-muted">
        You haven't submitted any claims yet.
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
