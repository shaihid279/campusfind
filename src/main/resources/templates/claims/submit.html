<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Item - CampusFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-1">Claim: <span th:text="${item.title}"></span></h3>
                    <p class="text-muted mb-4">Please provide details only the true owner would know.</p>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/claims/{itemId}/submit(itemId=${item.id})}" th:object="${claimRequest}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Describe a unique feature of the item</label>
                            <textarea class="form-control" rows="3" th:field="*{uniqueFeature}"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('uniqueFeature')}" th:errors="*{uniqueFeature}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Approximate purchase date</label>
                            <input type="text" class="form-control" th:field="*{approximatePurchaseDate}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Previous location (where you usually kept it)</label>
                            <input type="text" class="form-control" th:field="*{previousLocation}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Serial number (if available)</label>
                            <input type="text" class="form-control" th:field="*{serialNumber}">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Submit Claim</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
