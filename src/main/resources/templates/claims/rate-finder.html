<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate the Finder - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-cf p-4">
                <h4 class="mb-1">Rate the person who returned your item</h4>
                <p class="text-muted mb-4" th:text="${claim.item.title}"></p>

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/claims/{claimId}/rate(claimId=${claim.id})}" th:object="${ratingRequest}" method="post">

                    <div class="mb-3">
                        <label class="form-label d-block">How honest and helpful was the finder?</label>
                        <div class="rating-input d-flex flex-row-reverse justify-content-end gap-1">
                            <input type="radio" th:field="*{rating}" value="5" id="r5" hidden><label for="r5">★</label>
                            <input type="radio" th:field="*{rating}" value="4" id="r4" hidden><label for="r4">★</label>
                            <input type="radio" th:field="*{rating}" value="3" id="r3" hidden><label for="r3">★</label>
                            <input type="radio" th:field="*{rating}" value="2" id="r2" hidden><label for="r2">★</label>
                            <input type="radio" th:field="*{rating}" value="1" id="r1" hidden><label for="r1">★</label>
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Leave a short note of thanks (optional)</label>
                        <textarea class="form-control" rows="3" th:field="*{comment}" placeholder="e.g. Returned my wallet with everything intact, very honest!"></textarea>
                    </div>

                    <button type="submit" class="btn btn-cf-primary w-100">Submit Rating</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
