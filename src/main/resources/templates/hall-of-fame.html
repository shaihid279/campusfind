<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="hero-cf" style="padding: 60px 20px;">
    <h1 style="font-size: 2rem;">Hall of Fame</h1>
    <p class="lead">Honoring the students & staff who returned lost belongings with honesty.</p>
</div>

<div class="container py-5">
    <div class="row g-4" th:if="${not #lists.isEmpty(honorRoll)}">
        <div class="col-md-4" th:each="entry, iter : ${honorRoll}">
            <div class="honor-card">
                <span class="honor-rank" th:text="${iter.index + 1}"></span>
                <img th:if="${entry.photoUrl}" th:src="@{${entry.photoUrl}}" class="honor-avatar" style="object-fit:cover;">
                <div th:unless="${entry.photoUrl}" class="honor-avatar" th:text="${#strings.substring(entry.fullName, 0, 1)}"></div>
                <h5 class="mb-1" th:text="${entry.fullName}"></h5>
                <p class="text-muted small mb-2" th:text="${entry.department}"></p>
                <div class="star-rating mb-1">
                    <span th:text="${'★'.repeat(T(java.lang.Math).round(entry.averageRating))}"></span>
                    <span th:text="'(' + ${entry.averageRating} + ')'"></span>
                </div>
                <p class="text-muted small mb-0" th:text="${entry.totalReturns} + ' item(s) honestly returned'"></p>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(honorRoll)}" class="text-center text-muted py-5">
        <p>No ratings yet — be the first to recognize an honest finder!</p>
    </div>
</div>

<footer class="footer-cf text-center py-3 mt-5">
    <small>CampusFind &mdash; Dr. Vithhalrao Vikhe Patil College of Engineering</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
