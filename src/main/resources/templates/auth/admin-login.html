<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #10243e; min-height: 100vh; display: flex; align-items: center; }
        .admin-card { background: #1e3a5f; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .admin-card h3, .admin-card label { color: #fff; }
        .admin-badge { background: #0d9488; color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .form-control { background: #10243e; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .form-control:focus { background: #10243e; color: #fff; border-color: #0d9488; box-shadow: none; }
        .btn-admin { background: #0d9488; color: #fff; font-weight: 600; }
        .btn-admin:hover { background: #14b8a6; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="admin-card p-4 shadow">
                <div class="text-center mb-4">
                    <span class="admin-badge mb-2 d-inline-block">RESTRICTED ACCESS</span>
                    <h3 class="mt-2">CampusFind Admin</h3>
                    <p class="text-white-50 small mb-0">Authorized personnel only</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger">Invalid admin credentials.</div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Admin Email</label>
                        <input type="email" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-admin w-100">Sign In as Admin</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    <a th:href="@{/login}" class="text-white-50 small">← Back to student/staff login</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
