<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - CampusFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Notifications</h2>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
    </div>

    <div th:if="${not #lists.isEmpty(notifications)}">
        <div class="card mb-2 shadow-sm" th:each="n : ${notifications}"
             th:classappend="${n.read} ? '' : 'border-primary'">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-info text-dark mb-1" th:text="${n.type}"></span>
                    <p class="mb-1" th:text="${n.message}"></p>
                    <small class="text-muted" th:text="${n.createdAt}"></small>
                </div>
                <form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-primary">Mark as Read</button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="text-muted">
        No notifications yet.
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
