<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Welcome, <span th:text="${fullName}"></span></h2>
            <p class="text-muted mb-0">Here's what's happening with your reports and claims.</p>
        </div>
        <div>
            <a th:href="@{/notifications}" class="btn btn-outline-primary btn-sm">
                Notifications
                <span th:if="${not #lists.isEmpty(unreadNotifications)}"
                      class="badge bg-danger" th:text="${#lists.size(unreadNotifications)}"></span>
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3 th:text="${stats.lostCount}"></h3>
                    <p class="text-muted mb-0">Lost</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3 th:text="${stats.foundCount}"></h3>
                    <p class="text-muted mb-0">Found</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3 th:text="${stats.activeClaimsCount}"></h3>
                    <p class="text-muted mb-0">Active Claims</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3 th:text="${stats.recoveredCount}"></h3>
                    <p class="text-muted mb-0">Recovered</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-4">
        <a th:href="@{/items}" class="btn btn-outline-secondary btn-sm">Browse Items</a>
        <a th:href="@{/items/report-lost}" class="btn btn-danger btn-sm">Report Lost</a>
        <a th:href="@{/items/report-found}" class="btn btn-success btn-sm">Report Found</a>
        <a th:href="@{/claims/my}" class="btn btn-outline-primary btn-sm">My Claims</a>
    </div>

    <!-- My Items -->
    <h5>My Reported Items</h5>
    <div class="row g-3 mb-4" th:if="${not #lists.isEmpty(myItems)}">
        <div class="col-md-4" th:each="item : ${myItems}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <span class="badge mb-2" th:classappend="${item.itemType.name() == 'LOST'} ? 'bg-danger' : 'bg-success'"
                          th:text="${item.itemType}"></span>
                    <span class="badge bg-secondary mb-2" th:text="${item.status}"></span>
                    <h6 th:text="${item.title}"></h6>
                    <a th:href="@{/items/{code}(code=${item.uniqueItemCode})}" class="btn btn-sm btn-outline-primary">View</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(myItems)}" class="text-muted">You haven't reported any items yet.</p>

</div>
</body>
</html>
